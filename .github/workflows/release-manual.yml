name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. rules-20250210)
        required: true
      name:
        description: Release name
        required: true
        default: Manual Rules Release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: go build -o forgerules ./cmd/forgerules

      - name: Test converter
        run: go test ./...

      - name: Run converter
        run: |
          ./forgerules -converter-revision "${GITHUB_SHA}"

      - name: Create release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          files: |
            official_geosite.json
            official_geoip.mmdb
            loyalsoldier_geosite.json
            loyalsoldier_geoip.mmdb
            rules.sources.lock.json
            rules-manifest.json
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
