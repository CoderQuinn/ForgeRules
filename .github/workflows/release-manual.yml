name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. rules-20250210)
        required: true
      name:
        description: Release name
        required: true
        default: Manual Rules Release

permissions:
  contents: write

concurrency:
  group: forgerules-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a new immutable dated tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/check-release-tag-available.sh origin "${RELEASE_TAG}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: go build -o forgerules ./cmd/forgerules

      - name: Test converter and enforce Go-cover-profile-owned line coverage
        run: ./Scripts/check-go-coverage.sh

      - name: Run converter
        run: |
          ./forgerules -converter-revision "${GITHUB_SHA}"

      - name: Create dated draft release
        id: dated_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/create-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "${RELEASE_NAME}" "${GITHUB_SHA}" .

      - name: Verify dated draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" draft .

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/publish-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Verify published dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" published .

      - name: Clean up failed dated release
        if: ${{ failure() && steps.dated_draft.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./Scripts/cleanup-failed-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"
