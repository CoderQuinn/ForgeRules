name: Build Rules

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: go build -o forgerules ./cmd/forgerules

      - name: Test converter
        run: go test ./...

      - name: Run converter
        run: |
          ./forgerules -converter-revision "${GITHUB_SHA}"

      - name: Prepare release tag
        id: tag
        run: |
          echo "tag=rules-$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Delete previous latest release
        uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create latest release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: latest
          name: Latest Rules
          files: |
            official_geosite.json
            official_geoip.mmdb
            loyalsoldier_geosite.json
            loyalsoldier_geoip.mmdb
            rules.sources.lock.json
            rules-manifest.json
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dated release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            official_geosite.json
            official_geoip.mmdb
            loyalsoldier_geosite.json
            loyalsoldier_geoip.mmdb
            rules.sources.lock.json
            rules-manifest.json
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
