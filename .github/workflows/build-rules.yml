name: Build Rules

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:
    inputs:
      release_scope:
        description: Publish a full dated release or repair only the mutable latest alias
        required: true
        default: full
        type: choice
        options:
          - full
          - latest-only

permissions:
  contents: write

concurrency:
  group: forgerules-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.release_scope == 'full' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: go build -o forgerules ./cmd/forgerules

      - name: Test converter and enforce Go-cover-profile-owned line coverage
        run: ./Scripts/check-go-coverage.sh

      - name: Run converter
        run: |
          ./forgerules -converter-revision "${GITHUB_SHA}"

      - name: Prepare release tag
        if: ${{ env.FULL_RELEASE == 'true' }}
        id: tag
        run: |
          echo "tag=rules-$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Require a new immutable dated tag
        if: ${{ env.FULL_RELEASE == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/check-release-tag-available.sh origin "${RELEASE_TAG}"

      - name: Create dated draft release
        if: ${{ env.FULL_RELEASE == 'true' }}
        id: dated_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/create-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "Release ${RELEASE_TAG}" "${GITHUB_SHA}" .

      - name: Verify dated draft release
        if: ${{ env.FULL_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" draft .

      - name: Publish dated release
        if: ${{ env.FULL_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/publish-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Verify published dated release
        if: ${{ env.FULL_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" published .

      - name: Clean up failed dated release
        if: ${{ failure() && env.FULL_RELEASE == 'true' && steps.dated_draft.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/cleanup-failed-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Prepare latest staging tag
        id: latest_tag
        run: echo "tag=latest-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Create latest staging draft
        id: latest_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: ./Scripts/create-draft-release.sh "${GITHUB_REPOSITORY}" "${STAGING_TAG}" "Latest Rules" "${GITHUB_SHA}" .

      - name: Verify latest staging draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
          STAGING_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${STAGING_TAG}" "${GITHUB_SHA}" draft .

      - name: Delete previous latest release explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Scripts/delete-latest-release.sh "${GITHUB_REPOSITORY}"

      - name: Retag verified staging draft to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
          STAGING_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: ./Scripts/retag-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${STAGING_TAG}" latest "${GITHUB_SHA}"

      - name: Verify retagged latest draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}" draft .

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/publish-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}"

      - name: Verify published latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}" published .

      - name: Clean up failed latest release
        if: ${{ failure() && steps.latest_draft.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
          STAGING_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: ./Scripts/cleanup-failed-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${STAGING_TAG}" "${GITHUB_SHA}" latest
