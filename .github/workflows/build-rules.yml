name: Build Rules

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgerules-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build converter
        run: go build -o forgerules ./cmd/forgerules

      - name: Test converter and enforce executable-line coverage
        run: ./Scripts/check-go-coverage.sh

      - name: Run converter
        run: |
          ./forgerules -converter-revision "${GITHUB_SHA}"

      - name: Prepare release tag
        id: tag
        run: |
          echo "tag=rules-$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Require a new immutable dated tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/check-release-tag-available.sh origin "${RELEASE_TAG}"

      - name: Create dated draft release
        id: dated_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/create-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "Release ${RELEASE_TAG}" "${GITHUB_SHA}" .

      - name: Verify dated draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" draft .

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/publish-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Verify published dated release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}" published .

      - name: Clean up failed dated draft
        if: ${{ failure() && steps.dated_draft.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.dated_draft.outputs.id }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./Scripts/cleanup-failed-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Delete previous latest release explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Scripts/delete-latest-release.sh "${GITHUB_REPOSITORY}"

      - name: Create latest draft release
        id: latest_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./Scripts/create-draft-release.sh "${GITHUB_REPOSITORY}" latest "Latest Rules" "${GITHUB_SHA}" .

      - name: Verify latest draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}" draft .

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/publish-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}"

      - name: Verify published latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/verify-release-assets.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}" published .

      - name: Clean up failed latest draft
        if: ${{ failure() && steps.latest_draft.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.latest_draft.outputs.id }}
        run: ./Scripts/cleanup-failed-draft-release.sh "${GITHUB_REPOSITORY}" "${RELEASE_ID}" latest "${GITHUB_SHA}"
