name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-contract-gate:
    name: Go converter contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test immutable release-tag guard
        run: ./Scripts/test-release-tag-guard.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test converter
        run: go test ./...

      - name: Test converter with race detector
        run: go test -race ./...

      - name: Vet converter
        run: go vet ./...

      - name: Build CLI
        run: go build ./cmd/forgerules
